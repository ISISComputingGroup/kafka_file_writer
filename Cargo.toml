[package]
name = "kafka_file_writer"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", features = ["serde"] }
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
isis_streaming_data_types = "0.1.3"
toml = "1.1.6"
metrics-exporter-prometheus = { version = "0.18.3" }
hdf5 = { package = "hdf5-metno", version = "0.15.0", features = ["static"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
clap = "4.6.7"
clap-verbosity-flag = "3.0.4"
log = "0.4.34"
thiserror = "2.0.20"
itertools = "0.15.0"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = "0.4.45"

[target.'cfg(windows)'.dependencies]
rdkafka = { version="0.39.0", features = ["cmake_build"] }

[target.'cfg(unix)'.dependencies]
rdkafka = { version="0.39.0", features = ["cmake_build", "curl", "ssl-vendored"] }

[features]
bench = []

[dev-dependencies]
criterion = { version = "0.8.2",  features = ["html_reports"]}
flatbuffers = "25.12.19"

[lints.clippy]
indexing_slicing = "deny"
missing_safety_doc = "deny"
panic = "deny"
panic_in_result_fn = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[lib]
doctest = false
