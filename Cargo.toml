[package]
name = "kafka_file_writer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

default-run = "kafka_file_writer"

[dependencies]
itertools = "0.15.0"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = "0.4.45"

# Higher-performance HashMap
ahash = { version = "0.8.12", features = ["serde"] }

# Logging and metrics
log = "0.4.34"
env_logger = "0.11.11"
metrics-exporter-prometheus = { version = "0.18.3" }

# Deserialization from JSON/toml
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
serde_json = { version = "1.0.151" }

# Flatbuffers streaming type definitions
isis_streaming_data_types = "0.1.3"

# HDF5 support
hdf5 = { package = "hdf5-metno", version = "0.15.0", features = ["static"] }

# Error creation and reporting
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.20"
flatbuffers = "25.12.19"

# CLI configuration
clap = "4.6.7"
clap-verbosity-flag = "3.0.4"


[target.'cfg(windows)'.dependencies]
rdkafka = { version="0.39.0", features = ["cmake_build"] }

[target.'cfg(unix)'.dependencies]
rdkafka = { version="0.39.0", features = ["cmake_build", "curl", "ssl-vendored"] }

[features]
bench = []

[dev-dependencies]
criterion = { version = "0.8.2",  features = ["html_reports"]}

[lints.clippy]
indexing_slicing = "deny"
missing_safety_doc = "deny"
panic = "deny"
panic_in_result_fn = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

[lib]
doctest = false

[profile.release]
lto = "thin"
codegen-units = 1
